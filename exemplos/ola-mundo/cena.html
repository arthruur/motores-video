<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Olá, mundo</title>
<style>
  @font-face { font-family: 'Barlow Condensed'; src: url('/_fontes/BarlowCondensed-ExtraBold.ttf'); font-weight: 800; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: linear-gradient(160deg, #0f2a3d 0%, #123b4f 55%, #1d5a5e 100%); font-family: 'Barlow Condensed', sans-serif; }
  /* tudo dentro da zona segura 9:16 (x 120–780 na altura dos botões da direita; y 288–1248) */
  #palco { position: absolute; inset: 0; }
  #forma { position: absolute; left: 450px; top: 640px; width: 300px; height: 300px; margin: -150px 0 0 -150px;
    background: #f2b84b; }
  #titulo { position: absolute; left: 140px; width: 620px; top: 880px; text-align: center; color: #fff;
    font-size: 150px; font-weight: 800; letter-spacing: 2px; white-space: pre; }
  #titulo span { display: inline-block; }
  #sub { position: absolute; left: 140px; width: 620px; top: 1090px; text-align: center; color: #bfe3e0;
    font-size: 56px; font-weight: 800; line-height: 1.1; }
</style>
</head>
<body>
<div id="palco">
  <div id="forma"></div>
  <div id="titulo"></div>
  <div id="sub">uma cena é uma<br>função do tempo</div>
</div>
<script>
// Tudo o que aparece na tela é calculado a partir de t: sem CSS animation, transition, setTimeout ou relógio.
const TEXTO = 'Olá, mundo'
const titulo = document.getElementById('titulo'), forma = document.getElementById('forma'), sub = document.getElementById('sub')
const letras = [...TEXTO].map(c => { const s = document.createElement('span'); s.textContent = c; titulo.appendChild(s); return s })

const lim = x => Math.min(1, Math.max(0, x))
const fase = (t, ini, dur) => lim((t - ini) / dur)          // 0 antes de ini, 1 depois de ini+dur
const saiDeVolta = x => 1 + 2.7 * (x - 1) ** 3 + 1.7 * (x - 1) ** 2 // easeOutBack
const suave = x => x * x * (3 - 2 * x)
const r = (x, casas = 3) => +x.toFixed(casas)                 // arredonda: a chave de estado não muda à toa

function seek(t) {
  // 0–1 s: o círculo entra crescendo; 3,4–4,4 s: vira um quadrado arredondado e gira 90°
  const e = r(saiDeVolta(fase(t, 0, 1)))
  const m = r(suave(fase(t, 3.4, 1)))
  forma.style.transform = `scale(${e}) rotate(${r(m * 90, 2)}deg)`
  forma.style.borderRadius = `${r(50 - m * 32, 2)}%`
  forma.style.background = m < 0.5 ? '#f2b84b' : '#7fd1c7'

  // 0,4–2,4 s: as letras sobem uma a uma
  const chave = [e, m]
  letras.forEach((s, i) => {
    const p = r(suave(fase(t, 0.4 + i * 0.13, 0.5)))
    s.style.opacity = p
    s.style.transform = `translateY(${r((1 - p) * 80, 1)}px)`
    chave.push(p)
  })

  // 2,5–3,3 s: a frase de baixo aparece
  const q = r(fase(t, 2.5, 0.8))
  sub.style.opacity = q
  chave.push(q)
  // de 4,4 s em diante nada muda: a chave se repete e o motor reaproveita a foto
  return chave.join('|')
}

;(async () => {
  // a fonte precisa estar carregada antes do 1º quadro (senão o começo sai com a fonte reserva)
  await document.fonts.load('800 100px "Barlow Condensed"')
  await document.fonts.ready
  window.DURACAO = 6
  window.seek = seek
  seek(0)
  window.pronto = true
})()
</script>
</body>
</html>
