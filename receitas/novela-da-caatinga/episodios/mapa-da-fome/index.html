<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>O Mapa da Fome · episódio</title>
<style>
  @font-face { font-family: 'Caveat Brush'; src: url('../../fontes/CaveatBrush-Regular.ttf'); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #E1C89F; }
  #kraft { position: absolute; inset: 0; background: url('../../texturas/kraft.jpg'); }
  #kraft::after { content: ''; position: absolute; inset: 0; background: rgba(247, 232, 198, .45); }
  .fundo { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; transform-origin: 540px 1920px; transform: scale(1.55); opacity: 0; }
  #tinta { position: absolute; inset: 0; pointer-events: none; }
  #palco { position: absolute; inset: 0; }
  .letra { position: absolute; font-family: 'Caveat Brush', cursive; white-space: nowrap; }
  #marca { left: 0; width: 1080px; top: 296px; text-align: center; font-size: 40px; color: #8F4523; letter-spacing: 3px; }
  #rotulo { left: 0; width: 1080px; top: 352px; text-align: center; }
  #rotulo span { display: inline-block; background: #C5441E; color: #FFF8EA; font-size: 74px; padding: 2px 36px 8px; border-radius: 24px; }
  .chip { position: absolute; font-family: 'Caveat Brush', cursive; font-size: 58px; background: #462416; color: #F7E8C6;
          padding: 0 22px 4px; border-radius: 18px; white-space: nowrap; transform-origin: 50% 50%; }
  .chip.grande { font-size: 72px; white-space: normal; width: 640px; text-align: center; background: #C5441E; color: #FFF8EA; }
  .chip.claro { background: #F7E8C6; color: #462416; }
  .chip.risca::after { content: ''; position: absolute; left: 10px; right: 10px; top: 50%; height: 9px; background: #CF3B27; border-radius: 4px; transform: rotate(-8deg); }
  #legenda { left: 110px; width: 680px; top: 1142px; text-align: center; font-size: 86px; line-height: 1.02; white-space: normal; }
  #legenda .placa { display: inline-block; background: #F7E8C6; border-radius: 22px; padding: 4px 26px 10px; }
  #legenda span.p { display: inline-block; margin: 0 8px; }
  #cartela { left: 90px; width: 900px; top: 440px; text-align: center; color: #462416; background: #F7E8C6; border-radius: 36px; padding: 30px 0 34px; }
  #cartela .t1 { font-size: 132px; line-height: 1; display: block; }
  #cartela .t2 { font-size: 46px; color: #8F4523; display: block; margin-top: 16px; }
  #cartela .t3 { font-size: 34px; color: #AF561E; display: block; margin-top: 10px; }
  #grao { position: absolute; inset: 0; background: url('../../texturas/grao.png'); opacity: .08; mix-blend-mode: multiply; }
</style>
</head>
<body>
<div id="kraft"></div>
<img id="f-canavial" class="fundo" src="fundos/canavial.png" alt="">
<img id="f-sertao" class="fundo" src="fundos/sertao.png" alt="">
<div id="tinta"></div>
<svg id="palco" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs><clipPath id="revela"><rect id="revela-r" x="-20" y="-20" width="0" height="760"/></clipPath></defs>
  <g id="mapa-g"></g>
  <g id="lugar"></g>
  <g id="m-sombra"></g>
  <g id="mangaio"></g>
  <g id="frente"></g>
</svg>
<div id="marca" class="letra">NOVELA DA CAATINGA</div>
<div id="rotulo" class="letra"><span></span></div>
<div id="chips"></div>
<div id="legenda" class="letra"></div>
<div id="cartela" class="letra"><span class="t1">O Mapa da Fome</span><span class="t2">Novela da Caatinga · uma história do Mangaio</span><span class="t3">a partir de Geografia da Fome, de Josué de Castro (1946)</span></div>
<div id="grao"></div>
<script src="mapa.js"></script>
<script src="cena.js"></script>
</body>
</html>
