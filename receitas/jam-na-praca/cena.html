<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Saudade da Jam · Jam na Praça</title>
<link rel="stylesheet" href="cena.css">
</head>
<body>
<div id="palco">
  <div id="filme"><img id="quadro" alt=""></div>
  <!-- plano do palco: o quadro 16:9 inteiro abre do recorte 9:16 até caber na largura -->
  <div id="palco16"><img id="palcoFundo" alt=""><img id="palcoFrente" alt=""></div>
  <!-- solo de conga: campo de cor que multiplica o filme em alto contraste (silhueta preta) -->
  <div id="bebop"><div class="campo"></div><div class="bloco"></div><div class="jornal"></div></div>
  <div id="faixas"></div>
  <!-- cartão de entrada do solo: dois painéis deixam uma fresta com as mãos na conga -->
  <div id="cartao"><div class="painel cima"><div class="jornal"></div></div><div class="painel baixo"><div class="jornal"></div></div></div>
  <div id="tinta"></div>
  <svg id="desenhos" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
  <div id="textos"></div>
  <div id="creditos"><div class="rotulo"></div><div class="nome"></div></div>
  <div class="grao"></div>
  <div class="vinheta"></div>
  <div id="cortina"></div>
</div>
<script src="../promo/kit.js"></script>
<script src="cena.js"></script>
</body>
</html>
